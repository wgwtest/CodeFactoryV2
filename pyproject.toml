[project]
name = "knowledge-warehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
