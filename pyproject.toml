[project]
name = "knowledge-warehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.5",
  "neo4j>=5.28.0",
  "docling>=2.41.0",
  "unstructured>=0.17.2",
  "llama-index-core>=0.12.0",
  "llama-index-llms-openai>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
